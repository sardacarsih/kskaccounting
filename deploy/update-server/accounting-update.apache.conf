# Accounting update files, served by the existing update.kskgroup.web.id vhost
# (/etc/httpd/conf.d/smartmillscale-updates.conf) through Cloudflare Tunnel -> Apache :80.
# Installed by setup-update-server.sh to /etc/httpd/conf.d/update-vhost.d/accounting.conf and
# pulled into that <VirtualHost> with IncludeOptional, so the other apps' rules stay untouched.

Alias /accounting/ /srv/accounting-update/accounting/

<Directory /srv/accounting-update/accounting>
    AllowOverride None
    Options -Indexes -ExecCGI -Includes -FollowSymLinks
    Require method GET HEAD

    # Only the manifest and installer packages are public; *.tmp uploads and anything else are denied.
    <FilesMatch "^(?!(?:latest\.json|Accounting-[0-9.]+-win-(?:x64|x86)\.zip)$)">
        Require all denied
    </FilesMatch>

    # Clients must always see the newest manifest.
    <Files "latest.json">
        ForceType application/json
        Header always set Cache-Control "no-cache, no-store, must-revalidate"
    </Files>

    # Package names carry the version, so they never change once published.
    <FilesMatch "^Accounting-[0-9.]+-win-(x64|x86)\.zip$">
        ForceType application/zip
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
</Directory>
